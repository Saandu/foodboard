name: Reset demo data

# This restores only the showcase account. Customer workspaces are never reset.

on:
  schedule:
    # Every three hours across the working day, plus one overnight run.
    #
    # The credentials are published, so the demo is defaced-until-reset rather
    # than defaced-until-noticed, and a daily reset meant a visitor's mess could
    # sit there for 23 hours — plausibly the hour a reviewer opens the link.
    #
    # GitHub only schedules in UTC. These are 09:00, 12:00, 15:00, 18:00 and
    # 00:00 Romanian time while EEST (UTC+3) is in force; they drift an hour
    # later in local terms when the country falls back to EET in October.
    - cron: '0 6,9,12,15,21 * * *'
  # Allows a manual reset from the Actions tab.
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Reseed Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Auth user id that owns the showcase restaurants. Without it the
          # reset hands the demo menus to a placeholder owner.
          SHOWCASE_USER_ID: ${{ secrets.SHOWCASE_USER_ID }}
        run: npm run seed
